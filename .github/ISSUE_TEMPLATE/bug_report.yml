name: Bug report
description: Something does not work as documented. NOT for security findings — see SECURITY.md.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **If this lets anyone read, forge or destroy data they should not, stop and follow SECURITY.md instead.** Public issues are public.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Ideally a short Go test against this repository.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: scuttle version (tag or commit) and `go version`
    validations:
      required: true
